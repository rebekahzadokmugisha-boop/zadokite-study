<!doctype html><html><head><meta charset=utf8><meta name="theme-color" content="#1b2a5c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zadokite"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zadokite Study Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a family front door → four personal worlds (each with its own look) → a parents' room behind a PIN. */
:root{
  --bg:#eef3ef; --fg:#14231d; --muted:#5a6b63; --card:#ffffff; --line:#d5e0d9; --accent:#0e6b5c; --accent-ink:#ffffff;
  --good:#1f8a4c; --warn:#c77a12; --bad:#c2413b;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1715;--fg:#e4eee9;--muted:#93a69d;--card:#17221f;--line:#2a3a35;--accent:#4cc3a8;--accent-ink:#06211b;--good:#5ccf8c;--warn:#f0b04d;--bad:#ef7b74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1715;--fg:#e4eee9;--muted:#93a69d;--card:#17221f;--line:#2a3a35;--accent:#4cc3a8;--accent-ink:#06211b;--good:#5ccf8c;--warn:#f0b04d;--bad:#ef7b74;color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.tiny{font-size:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor}
.status{font-size:13px;color:var(--muted)}

/* ---------- Front door ---------- */
.door-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.door-head h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:-.5px}
.door-head p{margin:4px 0 0;max-width:52ch}
.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.kidcard{position:relative;overflow:hidden;border:0;border-radius:22px;padding:20px;min-height:200px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;transition:transform .15s}
.kidcard:hover{transform:translateY(-3px)}
.kidcard .nm{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.kidcard .cl{font-size:14px;opacity:.85}
.kidcard .mini{display:flex;gap:10px;font-size:14px;font-weight:700}
.kidcard canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kidcard>*{position:relative}
.k-daudi{background:#1d1d21;color:#f4efe9;box-shadow:inset 0 0 0 3px #f26b1d}
.k-levi{background:#0b1030;color:#e9ecff}
.k-malaika{background:#fff;color:#3a2350;box-shadow:inset 0 0 0 4px #ffd1e3}
.k-israel{background:#ffd23f;color:#4a2a00}
.parentlink{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}

/* ---------- Kid worlds (each a deliberate single look) ---------- */
.world{min-height:100vh}
.world[data-kid="daudi"]{--w-bg:#17171a;--w-fg:#f4efe9;--w-card:#232327;--w-acc:#f26b1d;--w-acc-ink:#fff;--w-soft:#33241a;--w-line:#3d3d44;color-scheme:dark}
.world[data-kid="levi"]{--w-bg:#080c26;--w-fg:#e9ecff;--w-card:#141b45;--w-acc:#ffb547;--w-acc-ink:#1b1200;--w-soft:#222b63;--w-line:#2d3878;color-scheme:dark}
.world[data-kid="malaika"]{--w-bg:#fff6fa;--w-fg:#3a2350;--w-card:#ffffff;--w-acc:#e8357a;--w-acc-ink:#fff;--w-soft:#ffe4ef;--w-line:#f3c6da;color-scheme:light}
.world[data-kid="israel"]{--w-bg:#fff1c2;--w-fg:#4a2a00;--w-card:#ffffff;--w-acc:#ff6a00;--w-acc-ink:#fff;--w-soft:#ffe28a;--w-line:#f4cf6a;color-scheme:light}
.world{background:var(--w-bg);color:var(--w-fg);position:relative}
.world #stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.world .wrap{position:relative}
.world .btn,.play .btn{background:var(--w-acc);color:var(--w-acc-ink)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.back{background:transparent;border:2px solid var(--w-line);color:inherit;border-radius:999px;padding:6px 14px;font-weight:700}
.hello{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:20px}
.hello h1{font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-.5px}
.hello .sub{font-size:17px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--w-card);border:2px solid var(--w-line);border-radius:999px;padding:6px 14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bday{border-radius:18px;padding:14px 18px;margin-bottom:16px;font-family:var(--display);font-size:22px;font-weight:700;background:repeating-linear-gradient(45deg,#ff6a00 0 14px,#ff8f33 14px 28px);color:#fff}
.sect{font-family:var(--display);font-size:24px;font-weight:700;margin:26px 0 10px}
.quests{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.quest{background:var(--w-card);border:2px solid var(--w-line);border-radius:18px;padding:14px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .12s}
.quest:hover{transform:translateY(-2px)}
.quest .ic{font-size:28px;line-height:1}
.quest .t{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1}
.quest .s{font-size:13px;opacity:.8}
.quest.done{border-color:var(--w-acc)}
.quest.done .s{opacity:1;font-weight:700;color:var(--w-acc)}
.big2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.feature{background:var(--w-card);border:2px solid var(--w-line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px}
.feature h3{font-size:26px}
.feature p{margin:0}
.fact{background:var(--w-soft);border-radius:22px;padding:18px 20px}
.fact b{font-family:var(--display);font-size:18px}
.world[data-kid="malaika"] .quest,.world[data-kid="malaika"] .feature{background-image:repeating-linear-gradient(-35deg,rgba(232,53,122,.05) 0 2px,transparent 2px 7px)}
.world[data-kid="malaika"] .hello h1{background:linear-gradient(90deg,#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#3949ab,#8e24aa);-webkit-background-clip:text;background-clip:text;color:transparent}
.world[data-kid="malaika"] .hello h1::after{content:" 👑";-webkit-text-fill-color:initial;color:initial}
.world[data-kid="malaika"] .sect::before{content:"✦ ";color:#e8357a}
.world[data-kid="daudi"] .sect{text-transform:uppercase;letter-spacing:.06em;font-size:20px}
.world[data-kid="daudi"] .quest.done{box-shadow:inset 0 -4px 0 #f26b1d}
.torah{border-radius:22px;padding:18px 20px;margin-top:14px;border:2px solid var(--w-line);background:var(--w-card)}
.torah b{font-family:var(--display);font-size:18px}
.world[data-kid="israel"] .quest{border-radius:28px;min-height:140px;align-items:center;text-align:center;justify-content:center}
.world[data-kid="israel"] .quest .ic{font-size:44px}

/* ---------- Play overlay ---------- */
.play{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--w-bg);color:var(--w-fg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.play .inner{max-width:760px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
.play-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.play-head h2{font-size:24px}
.vis{background:var(--w-card);border:2px solid var(--w-line);border-radius:20px;padding:8px;margin-bottom:14px}
.vis svg{display:block;width:100%;height:auto}
.qcard{background:var(--w-card);border:2px solid var(--w-line);border-radius:22px;padding:20px}
.qnum{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.qtext{font-family:var(--display);font-size:clamp(22px,4vw,30px);font-weight:700;line-height:1.2;margin:6px 0 14px}
.qshow{font-size:44px;line-height:1.3;margin:-4px 0 14px;word-break:break-word}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--w-line);background:var(--w-bg);color:inherit;border-radius:16px;padding:14px;font-size:18px;font-weight:700;text-align:left;min-height:58px}
.opt:hover:not([disabled]){border-color:var(--w-acc)}
.opt.right{background:#2aa35a;border-color:#2aa35a;color:#fff}
.opt.wrong{background:#d9534f;border-color:#d9534f;color:#fff}
.opt[disabled]{cursor:default}
.world[data-kid="israel"] .opt,.play[data-kid="israel"] .opt{text-align:center;font-size:22px;min-height:96px}
.opt .em{display:block;font-size:46px;line-height:1.1}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;background:var(--w-soft)}
.fb .ok{font-family:var(--display);font-size:22px;font-weight:800}
.sowhat{margin-top:8px;border-top:2px dashed var(--w-line);padding-top:8px}
.sowhat b{font-family:var(--display)}
.timer{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.speak{background:var(--w-soft);border:0;border-radius:999px;padding:6px 12px;color:inherit;font-weight:700}
.result{text-align:center;padding:10px 0}
.result .big{font-family:var(--display);font-size:64px;font-weight:800;line-height:1}
.swatch{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;border:4px solid rgba(0,0,0,.12)}
.shape{display:block;margin:0 auto 14px}

/* ---------- Arcade ---------- */
.arcade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.game{background:var(--w-card);border:2px solid var(--w-line);border-radius:20px;padding:16px;text-align:left;color:inherit;display:flex;flex-direction:column;gap:6px;transition:transform .12s}
.game:hover{transform:translateY(-2px);border-color:var(--w-acc)}
.game .gi{font-size:30px;line-height:1}
.game .gt{font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1}
.game .gs{font-size:13px;opacity:.85}
.game .gb{font-size:12px;font-weight:700;color:var(--w-acc)}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.slot{width:40px;height:48px;border-radius:10px;border-bottom:4px solid var(--w-acc);background:var(--w-soft);display:grid;place-items:center;font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:48px;height:52px;border-radius:12px;border:2px solid var(--w-line);background:var(--w-bg);color:inherit;font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase}
.tile[disabled]{opacity:.25}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(4,1fr)}}
.mcard{min-height:92px;border-radius:14px;border:2px solid var(--w-line);background:var(--w-acc);color:var(--w-acc-ink);font-weight:700;font-size:13px;line-height:1.25;padding:8px;display:grid;place-items:center;text-align:center;word-break:break-word}
.mcard.up{background:var(--w-card);color:var(--w-fg)}
.mcard.got{background:#2aa35a;border-color:#2aa35a;color:#fff}
.mcard .em{font-size:40px}
.styles{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.styles td,.styles th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.styles th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
/* ---------- Parents' room ---------- */
.pr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pr-head h1{font-size:clamp(30px,5vw,44px);font-weight:800}
.lock{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.lock input,.set input{font:inherit;font-size:20px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .who h2{font-size:26px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:8px 10px}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.subj{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;font-size:14px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.p-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.p-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.p-bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.p-none{background:var(--bg);color:var(--muted)}
.todo{display:flex;flex-wrap:wrap;gap:6px}
.miss{margin:0;padding-left:18px;font-size:14px}
.miss li{margin:2px 0}
.ple{background:var(--bg);border-radius:14px;padding:12px}
.ple .g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.ple .g div{background:var(--card);border-radius:10px;padding:6px 4px;font-size:12px}
.ple .g b{display:block;font-family:var(--display);font-size:20px}
.set{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.set label{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.feed{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 18px;margin-top:18px}
.feed table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.feed td,.feed th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.feedwrap{overflow-x:auto}
@media (max-width:560px){.opts{grid-template-columns:1fr}.hello{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
</style>

<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   FAMILY
   ========================================================= */
const KIDS = {
  daudi:   {name:"Daudi",   age:13, cls:"Senior 1 · King's College Budo", theme:"Court & Garage — hoops, horsepower and science", color:"#f26b1d", ple:false},
  levi:    {name:"Levi",    age:11, cls:"Primary 5 · Clarke Junior",      theme:"Space & speed commander", color:"#3949ab", ple:true, pleYear:2028},
  malaika: {name:"Malaika", age:8,  cls:"Primary 3 · Clarke Junior",      theme:"Rainbow Princess",  color:"#e8357a", ple:true, pleYear:2030},
  israel:  {name:"Israel",  age:3,  cls:"Montessori · ages 3–6",          theme:"Sunny garden",    color:"#ff8a00", ple:false, birthday:"2026-11-12", turning:4}
};
const ORDER = ["daudi","levi","malaika","israel"];

/* =========================================================
   QUESTION BANKS  —  [question, correct, wrong, wrong, wrong, why, soWhat]
   ========================================================= */
const B = (q,a,b,c,d,why,w)=>({q,opts:[a,b,c,d],why,w});

const BANK = {
/* ---------------- DAUDI · S1 (new lower secondary curriculum) ---------------- */
daudi:{
 Biology:[
  B("What is the basic unit of life?","The cell","The tissue","The organ","The atom","Every living thing is built from cells; tissues and organs are groups of cells.","Doctors diagnose malaria, sickle cell and cancer by looking at cells under a microscope."),
  B("Which part of a plant cell carries out photosynthesis?","Chloroplast","Mitochondrion","Nucleus","Cell membrane","Chloroplasts hold chlorophyll, which traps sunlight to make food.","Every matooke, bean and blade of grass in Uganda starts as sunlight caught in chloroplasts."),
  B("Which structure does a plant cell have that an animal cell lacks?","Cell wall","Nucleus","Cytoplasm","Cell membrane","The cellulose cell wall gives plants their stiffness.","Cellulose from cell walls becomes paper, cotton cloth and the fibre in your food."),
  B("Getting rid of waste made by the body's chemical reactions is called…","Excretion","Egestion","Secretion","Respiration","Egestion removes undigested food; excretion removes metabolic waste like urea and CO₂.","Kidney machines (dialysis) do excretion for people whose kidneys fail."),
  B("Who created the two-name (binomial) system for naming living things?","Carl Linnaeus","Charles Darwin","Robert Hooke","Louis Pasteur","Linnaeus named species with genus + species, e.g. Homo sapiens.","Scientists in Brazil, Japan and Uganda all mean the same animal when they write Gorilla beringei."),
  B("How many legs does an adult insect have?","Six","Eight","Four","Ten","Insects have 3 body parts and 6 jointed legs; spiders have 8 and are not insects.","Insects pollinate about a third of the food we eat — coffee farmers in Uganda depend on bees."),
  B("Which insect spreads malaria?","Female Anopheles mosquito","Housefly","Tsetse fly","Male Culex mosquito","Only the female Anopheles feeds on blood and carries Plasmodium.","Knowing which insect spreads it is why bed nets and draining stagnant water save lives."),
  B("Which part of a flower makes pollen?","Anther","Stigma","Ovary","Sepal","The anther (on the filament) makes pollen; the stigma receives it.","Plant breeders at NARO move pollen by hand to create disease-resistant bananas."),
  B("Which instrument part holds the glass slide on a microscope?","Stage","Eyepiece","Mirror","Coarse focus knob","The slide sits on the stage, held by clips.","Lab technicians use this every day to count blood cells in hospitals.")
 ],
 Chemistry:[
  B("How would you get salt back from salty water?","Evaporation","Filtration","Decanting","Sieving","Dissolved salt passes through a filter; heating evaporates the water and leaves the salt.","This is how salt is harvested at Lake Katwe in western Uganda."),
  B("Which gas makes up about 78% of air?","Nitrogen","Oxygen","Carbon dioxide","Argon","Air is about 78% nitrogen and 21% oxygen.","Farmers grow beans partly because their root nodules turn air's nitrogen into natural fertiliser."),
  B("A solid turning straight into a gas is called…","Sublimation","Evaporation","Condensation","Melting","Sublimation skips the liquid stage, e.g. dry ice or iodine crystals.","Freeze-dried coffee and some vaccines are preserved using sublimation."),
  B("Which method separates the colours in black ink?","Chromatography","Distillation","Filtration","Evaporation","Different dyes travel up the paper at different speeds.","Forensic scientists use chromatography to test for drugs and poisons."),

function buildSet(kid,subject,n,seedStr){
 const r=rng(hash(seedStr));const out=[];const seen=new Set();let guard=0;
 const subs=SUBJECTS[kid].map(s=>s[0]);
 while(out.length<n&&guard<200){guard++;
  const s=subject==="__mix"?subs[out.length%subs.length]:subject;
  if(kid!=="israel"&&s!=="Mathematics"){
    const bank=BANK[kid][s].filter(q=>!q.tier||q.tier<=tierUnlocked(kid));const pool=shuffle(r,bank).filter(x=>!seen.has(x.q));
    if(pool.length){seen.add(pool[0].q);out.push({...pool[0],subject:s});continue}
  }
  const q=makeQuestion(kid,s,r);if(seen.has(q.q+q.opts[0]))continue;seen.add(q.q+q.opts[0]);out.push({...q,subject:s});
 }
 return out.map(q=>({...q,order:shuffle(r,[0,1,2,3])}));
}

function dayStr(d=new Date()){const z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`}
function daysBack(n){const d=new Date();d.setDate(d.getDate()-n);return dayStr(d)}
const of=k=>S.attempts.filter(a=>a.child===k);
function stars(k,day){return of(k).filter(a=>!day||a.day===day).reduce((s,a)=>s+(a.score||0),0)}
function streak(k){const days=new Set(of(k).map(a=>a.day));let n=0;for(let i=0;i<400;i++){const d=daysBack(i);if(days.has(d))n++;else if(i>0)break}return n}
function questDone(k,subject,day){const a=of(k).filter(x=>x.day===day&&x.subject===subject&&x.mode==="quest");return a.length?a.reduce((b,x)=>x.score/x.total>b.score/b.total?x:b):null}
function accBySubject(k,days=30){const since=daysBack(days);const m={};for(const a of of(k)){if(a.day<since)continue;for(const [s,v] of Object.entries(a.bySubject||{[a.subject]:[a.score,a.total]})){m[s]=m[s]||[0,0];m[s][0]+=v[0];m[s][1]+=v[1]}}return m}

function beeSentence(w,s){return s.replace(new RegExp(w,"ig"),"_____")}
function beeMisspell(word,r){const w=word,out=new Set(),lw=w;

  ()=>lw.replace(/ie/,"ei"),()=>lw.replace(/ei/,"ie"),
  ()=>lw.replace(/([bcdfglmnprstz])\1/,"$1"),
  ()=>{const m=[...lw.matchAll(/[bcdfgklmnprst](?=[aeiouy])/g)];if(!m.length)return lw;const x=m[Math.floor(r()*m.length)];return lw.slice(0,x.index)+x[0]+lw.slice(x.index)},
  ()=>lw.replace(/our/,"or"),()=>lw.replace(/ph/,"f"),()=>lw.replace(/gh/,"f"),()=>lw.replace(/c(?=[ei])/,"s"),()=>lw.replace(/k/,"c"),
  ()=>lw.replace(/ea/,"ee"),()=>lw.replace(/ou/,"ow"),()=>lw.replace(/y/,"i"),()=>lw.replace(/h(?=[aeiouy])/,""),
  ()=>{const v="aeiou";const idx=[...lw].map((c,i)=>v.includes(c.toLowerCase())?i:-1).filter(i=>i>0);if(!idx.length)return lw;const i=idx[Math.floor(r()*idx.length)];const nv=v.replace(lw[i].toLowerCase(),"")[Math.floor(r()*4)];return lw.slice(0,i)+nv+lw.slice(i+1)},
  ()=>{const i=1+Math.floor(r()*(lw.length-2));return lw.slice(0,i)+lw[i+1]+lw[i]+lw.slice(i+2)},
  ()=>{const i=1+Math.floor(r()*(lw.length-1));return lw.slice(0,i)+lw.slice(i+1)}];
 for(let n=0;n<80&&out.size<3;n++){const f=tries[Math.floor(r()*tries.length)];const x=f();if(x&&x!==w&&x.length>2&&!out.has(x))out.add(x)}
 return[...out]}
function beeAll(){return Object.values(BEE_LEVELS).flatMap(L=>L.words)}
function buildSpot(k){const r=rng(Date.now());const ws=shuffle(r,beeAll()).slice(0,12);
 return ws.map(([w,d,s])=>{const wrong=beeMisspell(w,r);while(wrong.length<3)wrong.push(w+"e".repeat(wrong.length+1));
  return{q:`Which is spelled correctly? (${d})`,opts:[w,...wrong.slice(0,3)],why:`“${w}” — ${s}`,subject:"English",order:shuffle(r,[0,1,2,3])}})}

  $("#next").focus()};
 const endBee=async()=>{await endGame(k,"bee","English",G.score,words.length,G.missed,`Spelling Bee · ${L.name}`,`${L.name}: ${G.score} of ${words.length} spelled right first time.`,{English:[G.score,words.length]},G.t0,()=>runBee(k,lv))};
 const _save=saveAttempt;saveAttempt=async a=>{saveAttempt=_save;return _save({...a,level:lv})};
 paint();setTimeout(say,300);
}

/* ---------- Word scramble ---------- */
function startScramble(k){
 const r=rng(Date.now());const words=shuffle(r,scrambleWords(k)).slice(0,8);
 if(words.length<3)return;
 const G={kid:k,words,i:0,score:0,missed:[],t0:Date.now(),by:{}};PLAY=G;const el=overlay(k);
 const draw=()=>{
  if(G.i>=G.words.length)return endGame(k,"scramble","Word scramble",G.score,G.words.length,G.missed,"Word scramble",`${G.score} words unscrambled.`,G.by,G.t0,()=>startScramble(k));
  const w=G.words[G.i];let letters;do{letters=shuffle(r,w.word.split(""))}while(letters.join("")===w.word&&w.word.length>1);
  G.tiles=letters.map((c,i)=>({c,i,used:false}));G.picked=[];G.revealed=false;
  paint();
 };
 const paint=()=>{const w=G.words[G.i];
  el.innerHTML=`<div class="inner"><div class="play-head"><h2>🔤 Word scramble</h2><button class="back" id="quit">✕ Stop</button></div>
  <div class="qcard"><div class="qnum">Word ${G.i+1} of ${G.words.length} · ${esc(w.subject)} · ⭐ ${G.score}</div>
   <div class="qtext" style="font-size:20px">Clue: ${esc(w.hint)}</div>
   <div class="slots">${w.word.split("").map((_,i)=>`<span class="slot">${G.picked[i]?esc(G.tiles[G.picked[i]-1].c):""}</span>`).join("")}</div>
   <div class="tiles">${G.tiles.map((t,i)=>`<button class="tile" data-t="${i}" ${t.used||G.revealed?"disabled":""}>${esc(t.c)}</button>`).join("")}</div>
   <div class="row" style="justify-content:center;margin-top:12px"><button class="back" id="undo">↶ Undo</button><button class="back" id="clr">Clear</button><button class="back" id="show">Show me</button></div>
   <div id="fb"></div></div></div>`;
  $("#quit").onclick=closeOverlay;
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const i=+b.dataset.t;G.tiles[i].used=true;G.picked.push(i+1);check()});
  $("#undo").onclick=()=>{const last=G.picked.pop();if(last)G.tiles[last-1].used=false;paint()};
  $("#clr").onclick=()=>{G.picked=[];G.tiles.forEach(t=>t.used=false);paint()};
  $("#show").onclick=()=>{G.revealed=true;G.missed.push(`${w.subject}: ${w.hint.slice(0,90)}`);tally(w,false);feedback(false)};
 };
 const tally=(w,ok)=>{G.by[w.subject]=G.by[w.subject]||[0,0];G.by[w.subject][1]++;if(ok)G.by[w.subject][0]++};
 const check=()=>{const w=G.words[G.i];if(G.picked.length<w.word.length)return paint();
  const guess=G.picked.map(p=>G.tiles[p-1].c).join("");
  if(guess===w.word){G.score++;tally(w,true);G.revealed=true;feedback(true)}else{paint();$("#fb").innerHTML=`<div class="fb pop"><div class="ok">Not quite — try again or tap Clear.</div></div>`}};
 const feedback=ok=>{paint();const w=G.words[G.i];
  $("#fb").innerHTML=`<div class="fb pop"><div class="ok">${ok?"You got it!":"The word is"} <span style="text-transform:uppercase">${esc(w.word)}</span></div><div>${esc(w.why)}</div>${w.w?`<div class="sowhat"><b>🌍 So what?</b> ${esc(w.w)}</div>`:""}<div style="margin-top:10px"><button class="btn" id="next">Next →</button></div></div>`;
  $("#next").onclick=()=>{G.i++;draw()};$("#next").focus()};
 draw();
}

/* ---------- Memory match ---------- */
function startMatch(k){
 const r=rng(Date.now());let pairs;
 if(k==="israel"){const E=shuffle(r,["🍎","🍌","🚗","🚌","🐄","🦁","🌸","⭐","🐟","🦒","🚜","🌈"]).slice(0,6);pairs=E.map((e,i)=>({id:i,a:`<span class="em">${e}</span>`,b:`<span class="em">${e}</span>`,subject:"Pairs"}))}
 else{const pool=shuffle(r,poolOf(k).filter(q=>q.q.length<=70&&cleanOpt(q.opts[0]).length<=28));pairs=pool.slice(0,6).map((q,i)=>({id:i,a:esc(q.q),b:esc(cleanOpt(q.opts[0])),subject:q.subject,why:q.why,w:q.w}))}
 const cards=shuffle(r,pairs.flatMap(p=>[{id:p.id,html:p.a},{id:p.id,html:p.b}]));
 const G={kid:k,cards,up:[],got:new Set(),moves:0,t0:Date.now(),last:null};PLAY=G;const el=overlay(k);
 const paint=()=>{el.innerHTML=`<div class="inner"><div class="play-head"><h2>🃏 ${k==="israel"?"Picture pairs":"Memory match"}</h2><button class="back" id="quit">✕ Stop</button></div>
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="chip">Pairs ${G.got.size}/${pairs.length}</span><span class="chip">Moves ${G.moves}</span></div>
  <div class="mgrid">${G.cards.map((c,i)=>{const up=G.up.includes(i),got=G.got.has(c.id);return`<button class="mcard ${got?"got":up?"up":""}" data-c="${i}" ${got?"disabled":""} aria-label="${up||got?"card":"face-down card"}">${up||got?c.html:(k==="israel"?"?":"✦")}</button>`}).join("")}</div>
  <div id="fb"></div></div>`;
  $("#quit").onclick=closeOverlay;
  el.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>flip(+b.dataset.c));
  if(G.last&&k!=="israel"&&G.last.w)$("#fb").innerHTML=`<div class="fb pop"><div class="ok">Match!</div><div>${esc(G.last.why)}</div><div class="sowhat"><b>🌍 So what?</b> ${esc(G.last.w)}</div></div>`;
 };
 const flip=i=>{if(G.busy||G.up.includes(i))return;G.up.push(i);G.last=null;
  if(G.up.length===2){G.moves++;const [x,y]=G.up;
   if(G.cards[x].id===G.cards[y].id){G.got.add(G.cards[x].id);G.last=pairs[G.cards[x].id];G.up=[];if(k==="israel")speak("Well done! A pair!");
     if(G.got.size===pairs.length){paint();setTimeout(()=>endGame(k,"match",k==="israel"?"Pairs":"Memory match",pairs.length,G.moves,[],"",`${pairs.length} pairs in ${G.moves} moves. Fewer moves = stronger memory.`,null,G.t0,()=>startMatch(k)),700);return}}
   else{G.busy=true;paint();setTimeout(()=>{G.up=[];G.busy=false;paint()},1100);return}}
  paint()};
 paint();
}

/* ---------- Math sprint ---------- */
function startSprint(k){
 PLAY={kid:k,mode:"sprint",score:0,tries:0,end:Date.now()+60000,missed:[]};
 let el=$("#play");if(!el){el=document.createElement("div");el.id="play";document.body.appendChild(el)}
 el.className="play";el.dataset.kid=k;const w=document.querySelector(".world");
 for(const v of ["--w-bg","--w-fg","--w-card","--w-acc","--w-acc-ink","--w-soft","--w-line"])el.style.setProperty(v,getComputedStyle(w).getPropertyValue(v));
 const r=rng(Date.now());
 const next=()=>{
  if(!PLAY)return;const left=Math.max(0,Math.ceil((PLAY.end-Date.now())/1000));
  if(left<=0)return endSprint();
  const q=pick(r,GEN[k])(r);const order=shuffle(r,[0,1,2,3]);
  el.innerHTML=`<div class="inner"><div class="play-head"><h2>⚡ Math Sprint</h2><button class="back" id="quit">✕ Stop</button></div>
   <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="timer" id="tm">${left}s</span><span class="chip">✓ ${PLAY.score} right</span></div>
   ${sprintVis(k,PLAY.score,left)}
   <div class="qcard"><div class="qtext">${esc(q.q)}</div><div class="opts">${order.map(i=>`<button class="opt" data-i="${i}">${esc(q.opts[i])}</button>`).join("")}</div></div></div>`;
  $("#quit").onclick=()=>{clearInterval(PLAY.tick);el.remove();PLAY=null;render()};
  el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{PLAY.tries++;if(+b.dataset.i===0)PLAY.score++;else PLAY.missed.push("Mathematics: "+q.q);b.classList.add(+b.dataset.i===0?"right":"wrong");setTimeout(next,220)});
 };
 PLAY.tick=setInterval(()=>{const t=$("#tm");if(!PLAY){return}const left=Math.max(0,Math.ceil((PLAY.end-Date.now())/1000));if(t)t.textContent=left+"s";if(left<=0)endSprint()},250);
 next();
}
function sprintVis(k,sc,left){const W=640,H=70;
 if(k==="malaika")return`<div class="vis"><svg viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#fff6fa"/>${Array.from({length:Math.min(sc,24)},(_,i)=>`<text x="${12+i*26}" y="44" font-size="22">${i%3===2?"👑":"✦"}</text>`).join("")}</svg></div>`;
 const x=20+Math.min(sc,30)/30*(W-90);
 return`<div class="vis"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Race car at ${sc} points"><rect width="${W}" height="${H}" fill="${k==="levi"?"#141b45":"#1d1d21"}"/><rect y="26" width="${W}" height="30" fill="#2c2c33"/><line x1="0" y1="41" x2="${W}" y2="41" stroke="#f4efe9" stroke-dasharray="14 12" stroke-opacity=".5"/>
  <rect x="${W-30}" y="26" width="10" height="30" fill="#fff"/><rect x="${W-30}" y="26" width="5" height="7.5" fill="#000"/><rect x="${W-25}" y="33.5" width="5" height="7.5" fill="#000"/><rect x="${W-30}" y="41" width="5" height="7.5" fill="#000"/><rect x="${W-25}" y="48.5" width="5" height="7.5" fill="#000"/>
  <text x="${x}" y="50" font-size="30" transform="scale(-1,1) translate(${-2*x-36},0)">🏎️</text><text x="10" y="18" font-size="12" fill="#c9d0ff">Lap to 30 · ${sc} correct</text></svg></div>`}
async function endSprint(){
 const P=PLAY;if(!P||P.ended)return;P.ended=true;clearInterval(P.tick);const el=$("#play"),k=P.kid,best=bestSprint(k);
 el.innerHTML=`<div class="inner"><div class="qcard result pop"><div class="big">⚡ ${P.score}</div><h2 style="margin:10px 0 6px">${P.score>best?"New personal best!":"Sprint finished"}</h2>
  <p>${P.score} right out of ${P.tries} tries${best&&P.score<=best?` · your best is ${best}`:""}.</p>
  <div class="row" style="justify-content:center"><button class="btn" id="again">Sprint again</button><button class="back" id="home">Back</button></div><div class="status" id="savest">Saving…</div></div></div>`;
 $("#again").onclick=()=>startSprint(k);$("#home").onclick=()=>{el.remove();PLAY=null;render()};
 await saveAttempt({child:k,subject:"Mathematics",mode:"sprint",style:"sprint",dur:60000,score:P.score,total:Math.max(P.tries,1),missed:P.missed.slice(0,6),bySubject:{Mathematics:[P.score,Math.max(P.tries,1)]},day:dayStr(),ts:Date.now()});
 const st=$("#savest");if(st)st.textContent="Saved.";
}

function stylesPanel(k){const m={};for(const a of of(k)){const st=a.style||a.mode;if(!STYLE[st])continue;m[st]=m[st]||{n:0,s:0,t:0,d:0,dq:0};const o=m[st];o.n++;o.s+=a.score||0;o.t+=a.total||0;if(a.dur&&a.total&&st!=="sprint"&&st!=="match"){o.d+=a.dur;o.dq+=a.total}}
 const rows=Object.entries(m).sort((a,b)=>b[1].n-a[1].n);if(!rows.length)return`<div><div class="lbl">How ${esc(nameOf(k))} learns</div><div class="tiny muted">Styles appear after a few games.</div></div>`;
 const acc=o=>o.t?Math.round(o.s/o.t*100):0;const ranked=rows.filter(([,o])=>o.n>=2&&o[ "t"]).sort((a,b)=>acc(b[1])-acc(a[1]));
 const best=ranked[0],fav=rows[0];
 return`<div><div class="lbl">How ${esc(nameOf(k))} learns</div>
  <div class="tiny" style="margin:4px 0 6px">Favourite: <b>${STYLE[fav[0]]}</b>${best?` · Strongest: <b>${STYLE[best[0]]}</b> (${acc(best[1])}%)`:""}</div>
  <div class="feedwrap"><table class="styles"><thead><tr><th>Style</th><th>Plays</th><th>Score</th><th>Sec/question</th></tr></thead><tbody>
  ${rows.map(([st,o])=>`<tr><td>${STYLE[st]}</td><td>${o.n}</td><td>${st==="match"?"—":acc(o)+"%"}</td><td>${o.dq?Math.round(o.d/o.dq/1000):"—"}</td></tr>`).join("")}</tbody></table></div></div>`}
function kidPanel(k,today,week){
 const K=KIDS[k],subs=SUBJECTS[k].map(s=>s[0]);
 const acc=accBySubject(k,30);
 const totalA=Object.values(acc).reduce((s,v)=>[s[0]+v[0],s[1]+v[1]],[0,0]);
 const accPct=totalA[1]?Math.round(totalA[0]/totalA[1]*100):null;
 const wk=week.map(d=>stars(k,d));const max=Math.max(5,...wk);
 const missed=of(k).slice().sort((a,b)=>b.ts-a.ts).flatMap(a=>a.missed||[]).slice(0,4);
 const pill=p=>p===null?`<span class="pill p-none">no data</span>`:p>=80?`<span class="pill p-good">${p}%</span>`:p>=60?`<span class="pill p-warn">${p}%</span>`:`<span class="pill p-bad">${p}%</span>`;

 let ple="";
 if(K.ple){const m=PLE_MAP[k];const four=["Mathematics","English","Science","Social Studies"];
  const grade=pl=>{const srcs=Object.entries(m).filter(([s,t])=>t===pl||(Array.isArray(t)&&t.includes(pl))).map(([s])=>s);const v=srcs.reduce((a,s)=>acc[s]?[a[0]+acc[s][0],a[1]+acc[s][1]]:a,[0,0]);if(!v[1])return["—","Not yet practised"];const p=v[0]/v[1]*100;return p>=80?["D1","On pace"]:p>=70?["D2","Close"]:p>=60?["C3","Building"]:["C4+","Needs focus"]};
  const g=four.map(s=>[s,...grade(s)]);
  ple=`<div class="ple"><div class="lbl">Road to aggregate 4 · PLE ${K.pleYear}</div>
   <div class="g">${g.map(([s,gr,t])=>`<div><b>${gr}</b>${s==="Social Studies"?"SST":s.slice(0,4)}<div class="muted" style="font-size:11px">${t}</div></div>`).join("")}</div>
   <div class="tiny muted" style="margin-top:6px">Pace guide from 30-day practice accuracy (80%+ = D1 pace). ${k==="malaika"?"In P3, Topic (Literacy) feeds Science & SST.":""} Not an exam grade.</div></div>`}
 const W=280,H=70,bw=W/7-8;
 return`<div class="pcard"><div class="who"><h2><span class="dot" style="background:${K.color}"></span>${esc(nameOf(k))}</h2><span class="muted tiny">${esc(clsOf(k))}</span></div>

  <div><div class="lbl">Stars this week</div><svg viewBox="0 0 ${W} ${H+16}" width="100%" role="img" aria-label="Stars per day this week">
   <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"/>

  ${ple}

 </div>`;
